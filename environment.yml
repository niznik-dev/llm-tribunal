name: llm-tribunal
channels:
  - conda-forge
dependencies:
  # 3.12: newest Python with every wheel we need (CUDA/ROCm torch, optional kernels) on every platform.
  - python=3.12
  - pip
  - pip:
      # Floors are the versions this repo was tested with; ceilings stop the next major
      # version (which may break APIs) from installing itself.
      # NVIDIA or Apple: the default torch wheel is fine. AMD (ROCm) or a specific CUDA build:
      # install torch first from https://pytorch.org/get-started/locally/ then create this env.
      - torch>=2.14,<3
      - transformers>=5.19,<6  # 5.x is needed for Qwen3.5
      - huggingface_hub>=1.33,<2
      - accelerate>=1.15,<2
      - psutil>=7.2,<8
